spring:
  application:
    name: isd-hackathon-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:hackathon;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 로컬/개발은 create-drop, 운영(Supabase)은 validate + 마이그레이션 SQL 사용
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-only-secret-key-change-me-in-production}
    jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:43200}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    allowed-domains: ${ALLOWED_EMAIL_DOMAINS:hanyang.ac.kr}
    admin-emails: ${ADMIN_EMAILS:}
    professor-emails: ${PROFESSOR_EMAILS:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  storage:
    # Supabase Storage. 미설정 시 파일 업로드 API가 비활성화되고 링크 입력만 받는다.
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:submissions}
    max-upload-mb: ${MAX_UPLOAD_MB:50}

logging:
  level:
    kr.hyu.isd.hackathon: ${LOG_LEVEL:INFO}
