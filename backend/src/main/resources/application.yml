spring:
  application:
    name: isd-hackathon-backend

  datasource:
    # 기본값을 파일 DB로 둔다. 인메모리가 기본이면 DB_URL을 깜빡 빠뜨렸을 때
    # 재기동마다 가입·팀·제출이 조용히 사라진다.
    url: ${DB_URL:jdbc:h2:file:./data/hackathon;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 스키마만 맞추고 데이터는 건드리지 않는다. create-drop은 기동할 때마다
      # 테이블을 지우므로 기본값으로 두지 않는다.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  servlet:
    multipart:
      # Cloud Run은 HTTP/1 요청을 32MiB에서 끊는다. 그 위로는 우리 서버에 닿지도
      # 않고 영문 HTML 413이 돌아가므로, 한도를 그 아래에 두고 안내 문구를 우리가 낸다.
      max-file-size: 25MB
      max-request-size: 28MB

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  auth:
    jwt-secret: ${JWT_SECRET:local-development-only-secret-key-change-me-in-production}
    jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:43200}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    allowed-domains: ${ALLOWED_EMAIL_DOMAINS:hanyang.ac.kr}
    super-admin-emails: ${SUPER_ADMIN_EMAILS:xeye12@hanyang.ac.kr}
    admin-emails: ${ADMIN_EMAILS:}
    professor-emails: ${PROFESSOR_EMAILS:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  storage:
    # Supabase Storage. 미설정 시 파일 업로드 API가 비활성화되고 링크 입력만 받는다.
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:submissions}
    max-upload-mb: ${MAX_UPLOAD_MB:25}

logging:
  level:
    kr.hyu.isd.hackathon: ${LOG_LEVEL:INFO}
