# Cloud Run 배포용 환경변수 — 이 파일은 "틀"이다.
#
# 값을 채울 파일은 .env.deploy.yaml 이다. 여기에 직접 채우지 말 것.
# (이 파일은 저장소에 올라가고, .env.deploy.yaml 만 .gitignore에 들어 있다)
#
#   Copy-Item .env.deploy.example.yaml .env.deploy.yaml
#   notepad .env.deploy.yaml
#
#   gcloud run deploy isd-hackathon-backend --source . --region asia-northeast3 \
#     --allow-unauthenticated --env-vars-file .env.deploy.yaml

# ---- Supabase DB (Shared/Session pooler, 포트 5432) ----
DB_URL: "jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require"
DB_USERNAME: "postgres.프로젝트ID"
DB_PASSWORD: "여기에 DB 비밀번호"

# 최초 배포는 update로 테이블을 만들고, 한 번 뜬 뒤 validate로 바꾸는 편이 안전하다
JPA_DDL_AUTO: "update"

# ---- 인증 ----
# 32바이트 이상 임의 문자열. 기본값인 채로 실제 DB에 붙으면 서버가 기동을 거부한다.
JWT_SECRET: "여기에 생성한 키"
GOOGLE_CLIENT_ID: "여기에 클라이언트 ID"
ALLOWED_EMAIL_DOMAINS: "hanyang.ac.kr"
ADMIN_EMAILS: "운영진@hanyang.ac.kr"
PROFESSOR_EMAILS: ""

# ---- 프론트엔드 주소 ----
# Vercel 배포 전에는 로컬 주소만 넣어두고, 도메인이 나오면 쉼표로 덧붙인다
CORS_ALLOWED_ORIGINS: "http://localhost:3000"

# ---- 파일 저장소 ----
SUPABASE_URL: "https://프로젝트ID.supabase.co"
SUPABASE_SERVICE_KEY: "여기에 secret 키"
SUPABASE_BUCKET: "submissions"
MAX_UPLOAD_MB: "25"
